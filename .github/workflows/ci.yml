# TriFit Gym Manager — Integración continua
# 1. backend: instala, valida el schema Prisma y revisa sintaxis.
# 2. frontend: instala, tsc y build de producción.
# 3. e2e: levanta todo con Docker, siembra el dataset y corre Playwright.
name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Revisar sintaxis JS
        run: |
          for f in $(find src prisma -name '*.js'); do
            node --check "$f" || exit 1
          done

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build -- --configuration=production

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Levantar stack con Docker
        run: docker compose up -d --build
      - name: Esperar servicios sanos
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ >/dev/null \
              && curl -skf https://localhost:8443/ >/dev/null; then
              echo "Servicios listos"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "Timeout esperando servicios" >&2
              docker compose ps
              docker compose logs --tail=50
              exit 1
            fi
            sleep 10
          done
      - name: Sembrar dataset de prueba
        run: docker compose exec -T backend npm run seed:dataset
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar frontend y navegadores
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Correr suite e2e
        run: npx playwright test tests/membresias.spec.ts
        working-directory: frontend
      - name: Subir reporte Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
      - name: Apagar stack
        if: always()
        run: docker compose down -v
