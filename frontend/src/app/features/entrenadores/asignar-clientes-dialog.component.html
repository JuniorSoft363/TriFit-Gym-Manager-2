<h2 mat-dialog-title>Clientes de {{ data.nombreEntrenador }}</h2>

<mat-dialog-content style="min-width: 320px; max-width: 480px">
  <div style="display: flex; gap: 8px; align-items: flex-start">
    <mat-form-field appearance="outline" style="flex: 1">
      <mat-label>Cédula del cliente</mat-label>
      <input matInput [(ngModel)]="cedula" (keyup.enter)="agregar()" />
    </mat-form-field>
    <button mat-stroked-button type="button" style="margin-top: 8px" [disabled]="buscando" (click)="agregar()">
      Agregar
    </button>
  </div>

  <div *ngIf="cargando" class="tf-center" style="padding: 16px">
    <mat-spinner diameter="28"></mat-spinner>
  </div>

  <mat-list *ngIf="!cargando">
    <mat-list-item *ngFor="let a of asignaciones">
      <span matListItemTitle>{{ a.cliente?.nombres }} {{ a.cliente?.apellidos }}</span>
      <span matListItemLine>{{ a.cliente?.cedula }}</span>
      <button mat-icon-button matListItemMeta matTooltip="Quitar" (click)="quitar(a)">
        <mat-icon>close</mat-icon>
      </button>
    </mat-list-item>
  </mat-list>
  <p *ngIf="!cargando && !asignaciones.length" class="tf-vacio">Sin clientes asignados.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cerrar</button>
</mat-dialog-actions>
