<mat-sidenav-container class="tf-shell">
  <mat-sidenav mode="side" opened class="tf-sidenav">
    <div class="tf-logo-area">
      <div class="tf-logo-icon">
        <mat-icon>fitness_center</mat-icon>
      </div>
      <div class="tf-logo-text">
        <span class="tf-logo-title">TriFit</span>
        <span class="tf-logo-sub">Gym Manager</span>
      </div>
    </div>

    <mat-nav-list class="tf-nav-list">
      <span class="tf-nav-label">Menú</span>
      <a
        mat-list-item
        *ngFor="let item of menu"
        [routerLink]="['/app', item.ruta]"
        routerLinkActive="tf-activo"
        #rla="routerLinkActive"
        [class.tf-activo]="rla.isActive"
      >
        <mat-icon matListItemIcon>{{ item.icono }}</mat-icon>
        <span matListItemTitle>{{ item.etiqueta }}</span>
      </a>
    </mat-nav-list>

    <div class="tf-sidenav-footer">
      <div class="tf-sidenav-user">
        <ng-container *ngIf="urlFoto(); else sfIniciales">
          <img [src]="urlFoto()!" alt="Foto de perfil" class="tf-sidenav-avatar" />
        </ng-container>
        <ng-template #sfIniciales>
          <div class="tf-sidenav-avatar tf-sidenav-avatar-iniciales">{{ iniciales() }}</div>
        </ng-template>
        <div class="tf-sidenav-user-info">
          <span class="tf-sidenav-user-name">{{ auth.usuario()?.nombre }}</span>
          <span class="tf-sidenav-user-rol">{{ auth.usuario()?.rol }}</span>
        </div>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="tf-topbar">
      <span class="tf-topbar-title">TriFit Gym Manager</span>
      <span class="tf-spacer"></span>

      <button
        type="button"
        mat-icon-button
        class="tf-theme-toggle"
        (click)="alternarTema()"
        [attr.aria-label]="theme.tema() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
        matTooltip="{{ theme.tema() === 'dark' ? 'Tema claro' : 'Tema oscuro' }}"
      >
        <mat-icon>{{ theme.tema() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <button type="button" class="tf-user-trigger" [matMenuTriggerFor]="menuUsuario" aria-label="Menú de usuario">
        <ng-container *ngIf="urlFoto(); else inicialesTpl">
          <img [src]="urlFoto()!" alt="Foto de perfil" class="tf-user-avatar" />
        </ng-container>
        <ng-template #inicialesTpl>
          <div class="tf-user-avatar tf-user-avatar-iniciales">{{ iniciales() }}</div>
        </ng-template>
        <span class="tf-user-name">{{ auth.usuario()?.nombre }}</span>
        <mat-icon class="tf-user-chevron">expand_more</mat-icon>
      </button>

      <mat-menu #menuUsuario="matMenu" class="tf-usuario-menu" xPosition="before">
        <div class="tf-menu-header" mat-menu-item disabled>
          <div class="tf-menu-avatar-wrap">
            <ng-container *ngIf="urlFoto(); else menuIniciales">
              <img [src]="urlFoto()!" alt="Foto de perfil" class="tf-menu-avatar" />
            </ng-container>
            <ng-template #menuIniciales>
              <div class="tf-menu-avatar tf-menu-avatar-iniciales">{{ iniciales() }}</div>
            </ng-template>
          </div>
          <div class="tf-menu-info">
            <div class="tf-menu-nombre">{{ auth.usuario()?.nombre }}</div>
            <div class="tf-menu-correo">{{ auth.usuario()?.email }}</div>
            <div class="tf-menu-rol">{{ auth.usuario()?.rol }}</div>
          </div>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item routerLink="/app/perfil">
          <mat-icon>person</mat-icon>
          <span>Ver perfil</span>
        </button>
        <button mat-menu-item (click)="cerrarSesion()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="tf-main-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
