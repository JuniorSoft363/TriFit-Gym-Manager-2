<mat-sidenav-container class="tf-shell">
  <mat-sidenav mode="side" opened class="tf-sidenav">
    <div class="tf-logo-area">
      <div class="tf-logo-icon">
        <mat-icon>fitness_center</mat-icon>
      </div>
      <div class="tf-logo-text">
        <span class="tf-logo-title">TriFit</span>
        <span class="tf-logo-sub">Gym Manager</span>
      </div>
    </div>
    <mat-divider class="tf-divider"></mat-divider>
    <mat-nav-list class="tf-nav-list">
      <a
        mat-list-item
        *ngFor="let item of menu"
        [routerLink]="['/app', item.ruta]"
        routerLinkActive="tf-activo"
        #rla="routerLinkActive"
        [class.tf-activo]="rla.isActive"
      >
        <mat-icon matListItemIcon>{{ item.icono }}</mat-icon>
        <span matListItemTitle>{{ item.etiqueta }}</span>
      </a>
    </mat-nav-list>
    <span class="tf-sidenav-spacer"></span>
    <div class="tf-sidenav-footer">
      <button mat-button class="tf-logout-btn" (click)="cerrarSesion()">
        <mat-icon>logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="tf-topbar">
      <span class="tf-topbar-title">TriFit Gym Manager</span>
      <span class="tf-spacer"></span>
      <div class="tf-user-info">
        <mat-icon class="tf-user-icon">account_circle</mat-icon>
        <span class="tf-user-name">{{ auth.usuario()?.nombre }}</span>
        <span class="tf-user-rol">{{ auth.usuario()?.rol }}</span>
      </div>
    </mat-toolbar>

    <main class="tf-main-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
